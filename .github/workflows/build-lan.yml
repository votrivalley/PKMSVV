name: Build LAN PC Host Beta
on:
  push:
    branches: [feature/lan-local-beta]
    paths:
      - 'tests/mega-lucario.test.cjs'
      - 'tests/mega-forms.test.cjs'
      - 'tests/mega-ui-phase1.test.cjs'
      - 'tests/mega-ui-phase2.test.cjs'
      - 'src/pkmsvv-mega-phase2.css'
      - 'scripts/build-mega-ui-catalog.cjs'
      - 'src/pkmsvv-phase1-pastel.css'
      - 'src/pkmsvv-mega-entry.js'
      - 'data/mega-source-catalog.json'
      - 'src/pkmsvv-mega-lucario.js'
      - 'scripts/build-mega-lucario.cjs'
      - 'scripts/patch-mega-lucario.cjs'
      - 'config/android-signing-identity.json'
      - 'lan-server/**'
      - 'src/lan/**'
      - 'src/web/pkmsvv-arena.js'
      - 'src/web/pkmsvv-match-metrics.js'
      - 'tests/arena-v1529*.cjs'
      - 'tests/spawn-arena-v1529.test.cjs'
      - 'src/web/pkmsvv-royale.js'
      - 'src/web/pkmsvv-egg-rush.js'
      - 'src/shared/**'
      - 'tests/coop-icon-consistency.test.cjs'
      - 'tests/unified-coop.test.cjs'
      - 'tests/local-shell-ui.test.cjs'
      - 'tests/local-ui-lan-host-regression.test.cjs'
      - 'scripts/**'
      - 'desktop/lan-main.cjs'
      - 'desktop/lan-startup.cjs'
      - 'desktop/lan-connection.cjs'
      - 'desktop/lan-preload.cjs'
      - 'tests/lan-connection.test.cjs'
      - 'tests/lan-bus-retry.test.cjs'
      - 'tests/lan-ui-smoke.cjs'
      - 'tests/lan-electron-smoke.cjs'
      - 'desktop/lan-browser-host.cjs'
      - 'desktop/START-HOST-WIFI.cmd'
      - 'tests/lan-browser-host.test.cjs'
      - 'tests/lan-discovery.test.cjs'
      - 'tests/lan-ai-modes.test.cjs'
      - 'tests/competitive-rewards.test.cjs'
      - 'tests/dex-header-actions.test.cjs'
      - 'tests/starter-onboarding-browser.cjs'
      - 'src/pkmsvv-story.js'
      - 'tests/lan-ai-runtime.cjs'
      - 'tests/lan-rounds-runtime.cjs'
      - 'tests/lan-random-bots.test.cjs'
      - 'tests/lan-mode-rules.test.cjs'
      - 'tests/lan-mode-features-runtime.cjs'
      - 'tests/lan-coop-support.test.cjs'
      - 'tests/lan-coop-runtime.cjs'
      - 'tests/lan-startup.test.cjs'
      - 'tests/smoke-lan-win.ps1'
      - 'docs/LAN_FAST_START_WINDOWS.md'
      - 'lan-win.json'
      - 'package.json'
      - 'tests/lan-server.test.cjs'
      - 'tests/lan-compact-ui.test.cjs'
      - 'tests/lan-direct-entry.test.cjs'
      - '.github/workflows/build-lan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-lan:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load fixed upstream source
        shell: bash
        run: |
          git init vendor/pokesurvivor
          git -C vendor/pokesurvivor remote add origin https://github.com/JPTER78/pokesurvivor.git
          git -C vendor/pokesurvivor fetch --depth 1 origin 11fe868c640b62ac37beacc222e056bc4d9ec892
          git -C vendor/pokesurvivor checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate LAN server, room security and relay
        run: npm run test:lan && node --test tests/lan-startup.test.cjs tests/lan-discovery.test.cjs tests/lan-ai-modes.test.cjs tests/lan-browser-host.test.cjs tests/lan-compact-ui.test.cjs tests/lan-direct-entry.test.cjs tests/local-shell-ui.test.cjs tests/local-ui-lan-host-regression.test.cjs tests/coop-icon-consistency.test.cjs tests/unified-coop.test.cjs
      - name: Compile LAN game without Firebase
        run: npm run prepare:lan
        env:
          PKMSVV_MEGA_SPRITE_PACK: '1'
      - name: Verify Mega Lucario reversible 30-second form and asset credits
        run: npm run test:mega
      - name: Verify all 36 candidate Mega visual sets and per-form credits
        run: npm run test:mega:pack
      - name: Verify pastel Phase 1 menu, Mega entry and locked appearance
        run: npm run test:mega:ui
      - name: Verify read-only 96-form Mega encyclopedia and 12-per-page silhouettes
        run: npm run test:mega:phase2
      - name: Verify competitive rewards never leak across trainers
        run: node --test tests/competitive-rewards.test.cjs
      - name: Verify shared square Pokémon portrait in PC build
        run: node --test tests/dex-header-actions.test.cjs
      - name: Validate IP timeout and retry behavior
        run: node --test tests/lan-connection.test.cjs tests/lan-bus-retry.test.cjs
      - name: Install browser for real two-client LAN test
        run: npx playwright install chromium
      - name: Verify offline Wi-Fi WebRTC with ten clients and real game
        run: node tests/wifi-transport-runtime.cjs && node tests/wifi-coop-runtime.cjs
      - name: Verify PC first-run story skip, question skip and starter selection
        shell: bash
        run: PKMSVV_PLATFORM=lan node tests/starter-onboarding-browser.cjs
      - name: Play all three modes with two independent LAN clients
        run: npm run test:lan:runtime
      - name: Validate live and fallen AI rewards in all three modes
        run: npm run test:lan:ai
      - name: Validate consecutive AI rounds, random species and non-PvP Egg Rush
        run: node --test tests/lan-random-bots.test.cjs && npm run test:lan:rounds
      - name: Validate independent Survival, timed eggs, respawns and lobby kick UI
        run: npm run test:lan:modes
      - name: Validate natural Co-op AI and individual support pairs
        run: npm run test:lan:coop
      - name: Verify ten-player sidebar on portrait and landscape screens
        run: node --test tests/lan-hud-layout.test.cjs && node tests/lan-hud-runtime.cjs
      - name: Verify human can rescue a fallen AI teammate
        run: node tests/lan-ai-rescue-runtime.cjs
      - name: Verify P0 zone, eggs, opening spawns and private rewards
        run: node --test tests/arena-v1529.test.cjs tests/spawn-arena-v1529.test.cjs tests/lan-bot-snapshot.test.cjs tests/wifi-qr-license.test.cjs tests/competitive-rewards.test.cjs
      - name: Verify real Host guest and AI at 2 4 10 participants
        run: node tests/arena-v1529-runtime.cjs
      - name: Ten-minute P0 load profile with 10 participants
        run: node tests/arena-v1529-soak.cjs
      - name: Verify native PC IP failure and successful retry
        run: npm run test:lan:pc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PKMSVV-LAN-UI-QA
          path: dist/qa/
          if-no-files-found: ignore
      - name: Verify LAN content and isolation
        shell: bash
        run: |
          test -s dist/lan/index.html
          test -s dist/lan/game/index.html
          test -s dist/lan/game/js/app.min.js
          test -s dist/lan/game/assets/icons/icon-192.png
          if grep -q "pkmsvv-b84d2-default-rtdb" dist/lan/game/js/app.min.js; then
            echo "LAN compiled client unexpectedly references Firebase RTDB" >&2
            exit 1
          fi
      - name: Package lightweight PC Browser Host (Node.js, no Electron)
        shell: pwsh
        run: |
          $target="dist/lan-browser-host"
          New-Item -ItemType Directory -Force "$target/desktop","$target/lan-server","$target/node_modules" | Out-Null
          Copy-Item -Recurse dist/lan "$target/site"
          Copy-Item desktop/lan-browser-host.cjs,desktop/lan-startup.cjs "$target/desktop/"
          Copy-Item lan-server/server.cjs,lan-server/discovery.cjs,lan-server/bot-roster.json "$target/lan-server/"
          $pkg = '{"private":true,"dependencies":{"ws":"^8.18.0","qrcode":"^1.5.4"}}'
          Set-Content -Path "$target/package.json" -Value $pkg -Encoding utf8
          npm install --prefix $target --omit=dev --ignore-scripts --no-audit --no-fund
          Copy-Item desktop/START-HOST-WIFI.cmd "$target/START-HOST-WIFI.cmd"
          Copy-Item docs/LAN_FAST_START_WINDOWS.md "$target/README.md"
          if (!(Test-Path "$target/site/game/index.html")) { throw "Packaged LAN game missing" }
          if (!(Test-Path "$target/node_modules/ws/package.json")) { throw "WebSocket module missing" }
          if (!(Test-Path "$target/node_modules/qrcode/package.json")) { throw "QR generator missing" }
          node --check "$target/desktop/lan-browser-host.cjs"
      - uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-LAN-PC-Browser-Host
          path: dist/lan-browser-host/
          retention-days: 14
          if-no-files-found: error
      - name: Generate icon and build portable Windows LAN host
        run: npm run build:lan:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify host installer
        shell: bash
        run: |
          ls -lh dist/lan-windows/*.exe
          test -n "$(find dist/lan-windows -maxdepth 1 -name '*.exe' -print -quit)"
          test -s dist/lan-windows/win-unpacked/resources/lan-site/game/index.html
          test -s dist/lan-windows/win-unpacked/resources/lan-site/game/js/app.min.js
          test -s dist/lan-windows/win-unpacked/resources/lan-site/index.html
      - name: Smoke-test packaged Windows executable (runtime, not just build)
        shell: pwsh
        run: |
          $env:PKMSVV_PC_EXE=(Get-ChildItem dist/lan-windows/win-unpacked -Filter '*.exe' | Select-Object -First 1).FullName
          npm run test:lan:pc
      - name: Include Fast Start readme in the unpacked Windows folder
        shell: pwsh
        run: |
          Copy-Item docs/LAN_FAST_START_WINDOWS.md dist/lan-windows/win-unpacked/README-FAST-START.md
      - uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-LAN-Windows-Fast-Start
          path: dist/lan-windows/win-unpacked/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-LAN-Windows-Host-Beta
          path: dist/lan-windows/*.exe
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-LAN-Windows-Unpacked-Debug
          path: dist/lan-windows/win-unpacked/
          retention-days: 14
          if-no-files-found: error
