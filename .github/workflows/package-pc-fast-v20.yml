name: PC Fast Start - Pokémon Chuyển Sinh 2.0 (manual/release)
on:
  push:
    branches: [fix/pippi-follow-menu-qa-20261115]
    paths:
      - '.github/workflows/package-pc-fast-v20.yml'
      - 'src/pkmsvv-pippi.*'
      - 'src/pkmsvv-wiki.js'
      - 'src/pkmsvv-pc-menu-clean-qa.css'
      - 'src/pkmsvv-pc-menu-clean-qa.*'
      - 'src/shared/local-shell.js'
      - 'src/pkmsvv-menu-icons.webp'
      - 'scripts/prepare-game.cjs'
      - 'scripts/prepare-lan.cjs'
      - 'tests/pippi-companion.test.cjs'
      - 'src/pkmsvv-forget-skill.js'
      - 'src/pkmsvv-modal-navigation-qa.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pkmsvv-pc-fast-v20-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pc-fast:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PKMSVV_MEGA_SPRITE_PACK: '1' # Full 36 normal + 32 Shiny pack on build, not test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned original PokéSurvivor source
        shell: bash
        run: |
          set -euo pipefail
          pin=11fe868c640b62ac37beacc222e056bc4d9ec892
          git init vendor/pokesurvivor
          available=0
          for source in https://github.com/JPTER78/pokesurvivor.git \
                        https://github.com/Lucas-Vargas-0307/pokesurvivor.git \
                        https://github.com/IvanFreireDacoba/pokesurvivor.git; do
            git -C vendor/pokesurvivor remote remove origin >/dev/null 2>&1 || true
            git -C vendor/pokesurvivor remote add origin "$source"
            if GIT_TERMINAL_PROMPT=0 git -C vendor/pokesurvivor -c credential.helper= fetch --no-tags --depth 1 origin "$pin"; then
              available=1
              break
            fi
          done
          test "$available" -eq 1 || { echo "Pinned upstream Pokémon engine unavailable"; exit 1; }
          git -C vendor/pokesurvivor checkout --detach FETCH_HEAD
          test "$(git -C vendor/pokesurvivor rev-parse HEAD)" = "$pin" || {
            echo "Pinned engine commit mismatch"; exit 1;
          }
      - name: Install PC build dependencies
        run: npm install --no-audit --no-fund
      - name: Fetch exact PMD Pippi sprites and 16 offline portraits
        run: node scripts/fetch-pippi-pmd.cjs
      - name: Regression test Pippi following and Co-op artwork
        run: node --test tests/pippi-companion.test.cjs
      - name: Compile latest offline + LAN game
        run: npm run prepare:lan
      - name: Validate full 36-Mega pack before PC distribution
        run: node tests/mega-platform-parity.test.cjs pc
      - name: Validate bilingual 1.0–current changelog and preserve Vietnamese UI
        run: npm run test:localization
        env:
          PKMSVV_MEGA_SPRITE_PACK: '1'
      - name: Phase A legacy Berry UX (tracked QA issue; separate nonblocking suite)
        continue-on-error: true
        run: npm run test:berry:ux
      - name: Phase B safe item and Bond selections (blocking)
        run: npm run test:choice:queue
      - name: C+D+E — Held item selection, Solo Fusion pilot and deterministic season
        run: npm run test:ced
      - name: Existing solo Berry countdown tests (known legacy failures, separate QA finding)
        continue-on-error: true
        run: node --test tests/berry.test.cjs
      - name: Required Pippi / Co-op / Arena PvP QA (blocking)
        run: node --test tests/pippi-companion.test.cjs tests/unified-coop.test.cjs tests/arena-pvp.test.cjs tests/competitive-nonblocking.test.cjs
      - name: Legacy full-game regression audit (known baseline failures, nonblocking in this QA-only build)
        continue-on-error: true
        run: node --test tests/arena-pvp.test.cjs tests/berry-rescue.test.cjs tests/unified-coop.test.cjs tests/mega-arena-gacha.test.cjs tests/forget-skill.test.cjs tests/controller.test.cjs tests/mega-phase3.test.cjs tests/champion-arena.test.cjs tests/story-progression.test.cjs tests/chapter-purple-rewards.test.cjs tests/support-fast-shiny.test.cjs tests/competitive-nonblocking.test.cjs tests/royale-spectator.test.cjs
      - name: Package portable PC executable
        run: npm run build:lan:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify executable, LAN game and new hotkeys
        shell: pwsh
        run: |
          $dir='dist/lan-windows/win-unpacked'
          $exe=Get-ChildItem $dir -Filter '*.exe' | Select-Object -First 1
          if(!$exe -or $exe.Length -lt 100KB){throw 'Windows Fast Start EXE missing'}
          foreach($file in @(
            'resources/lan-site/game/index.html',
            'resources/lan-site/game/js/app.min.js',
            'resources/lan-site/game/js/ui/pkmsvv-pippi.js',
            'resources/lan-site/game/js/ui/pkmsvv-wiki-qa.js',
            'resources/lan-site/game/js/ui/pkmsvv-pc-menu-clean-qa.js',
            'resources/lan-site/game/images/pkmsvv-menu-icons.webp',
            'resources/lan-site/game/images/pkmsvv-research-lab-icon.png',
            'resources/lan-site/game/images/pkmsvv-research-station-icons.png',
            'resources/lan-site/game/images/coop-lab/room_base.png',
            'resources/lan-site/game/images/coop-lab/room_art_qa_v2.webp',
            'resources/lan-site/game/images/coop-lab/decor/machine_old.png',
            'resources/lan-site/game/images/coop-lab/decor/kabuto_skeleton.png',
            'resources/lan-site/game/images/coop-lab/decor/research_terminal.png',
            'resources/lan-site/game/images/pippi/Walk-Anim.png',
            'resources/lan-site/game/images/pippi/portrait/Happy.png',
            'resources/lan-site/game/assets/icons/icon-192.png'
          )){
            if(!(Test-Path (Join-Path $dir $file))){throw "Missing PC asset: $file"}
          }
          $app=Get-Content (Join-Path $dir 'resources/lan-site/game/js/app.min.js') -Raw
          if(!$app.Contains('pkmsvv-mega')){throw 'Mega control is not bundled'}
          if(!$app.Contains('pkmk-tab-berry')){throw 'Kecleon Berry shop missing'}
          if(!$app.Contains('PKMSVVBerryRescue')){throw 'Four-player Berry Rescue runtime missing'}
          $wiki=Get-Content (Join-Path $dir 'resources/lan-site/game/js/ui/pkmsvv-wiki-qa.js') -Raw
          if(!$wiki.Contains('function pippiCorner')){throw 'PC Góc Pippi screen missing'}
          $pippi=Get-Content (Join-Path $dir 'resources/lan-site/game/js/ui/pkmsvv-pippi.js') -Raw
          if(!$pippi.Contains('trainingPoints')){throw 'PC Pippi Bond training missing'}
           if(!$app.Contains('PKMSVVArenaPvp')){throw 'Real Host/Guest Arena PvP runtime missing'}
          $berryIcons=Get-ChildItem (Join-Path $dir 'resources/lan-site/game/assets/berry') -Filter '*.png'
          if($berryIcons.Count -ne 10){throw 'Exactly 10 Berry pixel sprites must be packaged'}
          Write-Host "Fast Start is ready: $($exe.Name) ($($exe.Length) bytes)"
      - name: Include Fast Start instructions
        shell: pwsh
        run: |
          Copy-Item docs/LAN_FAST_START_WINDOWS.md dist/lan-windows/win-unpacked/README-FAST-START.md
          "Source: ${{ github.sha }}" | Add-Content dist/lan-windows/win-unpacked/README-FAST-START.md
          "Controls: Mega = 4, Orb = 5 (customizable in Settings)." | Add-Content dist/lan-windows/win-unpacked/README-FAST-START.md
      - name: Upload PC Fast Start for testing
        uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-PC-Fast-V20-Spawn-Pool-Optimized
          path: dist/lan-windows/win-unpacked/
          retention-days: 14
          if-no-files-found: error

      - name: Compress PC QA portable for direct download
        shell: pwsh
        run: |
          $source='dist/lan-windows/win-unpacked'
          $archive='dist/PKMSVV-Goc-Pippi-PC-QA.zip'
          if(!(Test-Path $source)){throw 'PC portable directory missing'}
          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $archive -CompressionLevel Optimal -Force
          if((Get-Item $archive).Length -lt 1MB){throw 'PC QA ZIP unexpectedly small'}
      - name: Upload PC QA directly alongside Android APK (public Web unchanged)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload 'pkmsvv-pippi-follow-coop-qa-20261115' 'dist/PKMSVV-Goc-Pippi-PC-QA.zip' --clobber
          if($LASTEXITCODE -ne 0){throw 'Failed to attach PC ZIP to QA prerelease'}
