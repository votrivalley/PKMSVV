name: Build iOS HTML5 PWA Beta
on:
  push:
    branches: [feature/lan-local-beta]
    paths:
      - 'scripts/build-mega-shiny.cjs'
      - 'tests/mega-shiny.test.cjs'
      - 'src/pkmsvv-mega-lucario.js'
      - 'src/pkmsvv-mega-phase3.js'
      - 'src/pkmsvv-phase1-pastel.css'
      - 'src/pkmsvv-mega-phase2.css'
      - 'src/pkmsvv-mega-entry.js'
      - 'scripts/build-mega-ui-catalog.cjs'
      - 'scripts/patch-ui-phase2-mega.cjs'
      - 'tests/mega-ui-phase2.test.cjs'
      - 'scripts/**'
      - 'src/ios/**'
      - 'src/pkmsvv-champion-arena.js'
      - 'src/pkmsvv-arena-solo.js'
      - 'src/pkmsvv-arena-solo.css'
      - 'tests/arena-solo.test.cjs'
      - 'src/shared/**'
      - 'tests/coop-icon-consistency.test.cjs'
      - 'tests/unified-coop.test.cjs'
      - 'tests/local-shell-ui.test.cjs'
      - 'tests/local-ui-lan-host-regression.test.cjs'
      - 'tests/pages-lan-connect-runtime.test.cjs'
      - 'src/lan/**'
      - 'src/web/**'
      - 'src/pkmsvv-save-ui.js'
      - 'src/pkmsvv-native-choice.js'
      - 'package.json'
      - 'tests/ios-web.test.cjs'
      - '.github/workflows/build-ios-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load pinned game source
        shell: bash
        run: |
          git init vendor/pokesurvivor
          git -C vendor/pokesurvivor remote add origin https://github.com/JPTER78/pokesurvivor.git
          git -C vendor/pokesurvivor fetch --depth 1 origin 11fe868c640b62ac37beacc222e056bc4d9ec892
          git -C vendor/pokesurvivor checkout --detach FETCH_HEAD
      - run: npm install --no-audit --no-fund
      - run: npm run test:arena:solo
      - run: npm run test:ios && node --test tests/local-shell-ui.test.cjs tests/pages-lan-connect-runtime.test.cjs tests/unified-coop.test.cjs
      - run: npm run prepare:ios
      - name: Verify rendered Co-op uses static LAN link, not legacy Online
        shell: bash
        run: |
          test -s dist/ios/lan-connect.html
          test -s dist/ios/lan-connect.js
          grep -q 'id="pkmsvv-coop-lan-entry" href="/lan-connect.html"' dist/ios/game/index.html
          ! grep -q '<button class="menu-item" data-go="multiplayer"' dist/ios/game/index.html
          node --check dist/ios/lan-connect.js
      - name: Validate files and pack HTTPS-ready static site
        shell: bash
        run: |
          test -s dist/ios/index.html
          test -s dist/ios/sw.js
          test -s dist/ios/game/js/app.min.js
          test -s dist/ios/game/assets/icons/icon-180.png
          mkdir -p dist/ios-artifact
          cd dist/ios && zip -qr ../ios-artifact/PKMSVV-iOS-HTML5-PWA-Beta.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-iOS-HTML5-PWA-Beta
          path: dist/ios-artifact/*.zip
          retention-days: 14
          if-no-files-found: error
