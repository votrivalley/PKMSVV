name: Fossil Lab Data & Economy Core QA (no mission deploy)
on:
  push:
    branches: [fix/pippi-follow-menu-qa-20261115]
    paths:
      - 'data/pkmsvv-fossil-catalog.json'
      - 'docs/FOSSIL_EXCAVATION_DESIGN.md'
      - 'tests/fossil-restoration-data.test.cjs'
      - 'tests/fossil-system.test.cjs'
      - 'src/pkmsvv-fossil-system.js'
      - 'src/pkmsvv-coop-lab-core.cjs'
      - 'data/pkmsvv-coop-lab-catalog.json'
      - 'data/pkmsvv-coop-lab-art-direction.json'
      - 'docs/COOP_FOSSIL_LAB_ART_DIRECTION_V1.md'
      - 'tests/coop-lab-art-direction.test.cjs'
      - 'tests/coop-lab-core.test.cjs'
      - 'docs/COOP_FOSSIL_LAB_DECOR_SPEC_V1.md'
      - 'src/pkmsvv-wiki.js'
      - '.github/workflows/fossil-data-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fossil-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fossils, 8-slot lab, Co-op coins, rare trophy and save rollback
        run: node --test tests/fossil-restoration-data.test.cjs tests/fossil-system.test.cjs tests/coop-lab-core.test.cjs tests/coop-lab-art-direction.test.cjs
