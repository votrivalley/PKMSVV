name: Big Update progression and compiled inventory — isolated QA
on:
  push:
    branches: [feature/gmax-power-qa-20261127]
    paths:
      - 'src/pkmsvv-big-update-qa.js'
      - 'src/v15/eggs.js'
      - 'src/web/pkmsvv-egg-rush.js'
      - 'src/pkmsvv-support-catalog.js'
      - 'src/pkmsvv-wiki.js'
      - 'src/pkmsvv-pippi-guide.js'
      - 'scripts/patch-v15-egg-rush-web.cjs'
      - 'scripts/patch-v15-eggs.cjs'
      - 'src/shared/match-results.css'
      - 'tests/egg-rush*.test.cjs'
      - 'tests/egg-rush-rank-prize-browser.cjs'
      - 'tests/support-expansion*.cjs'
      - 'src/lan/solo-ai-bus.js'
      - 'src/pkmsvv-progression-merge.js'
      - 'tests/progression-merge.test.cjs'
      - 'scripts/patch-web-cloud-safe.cjs'
      - 'src/kecleon/**'
      - 'src/pkmsvv-mega-gacha.js'
      - 'scripts/patch-web-exclusive-session.cjs'
      - 'scripts/patch-web-cloud-multidevice.cjs'
      - 'tests/p0-transactions*.cjs'
      - 'src/pkmsvv-berry-rescue.js'
      - 'src/pkmsvv-dex-defeats-qa.js'
      - 'src/pkmsvv-quick-region.js'
      - 'src/pkmsvv-eternamax-qa.js'
      - 'src/pkmsvv-combat-balance-qa.js'
      - 'src/pkmsvv-combat-tactics-qa.js'
      - 'src/pkmsvv-bond-fusion.js'
      - 'tests/horde-performance.test.cjs'
      - 'tests/bond-fusion-svv.test.cjs'
      - 'src/lan/lan-ai.js'
      - 'tests/combat-tactics*.cjs'
      - 'tests/lan-ai-modes.test.cjs'
      - 'src/pkmsvv-3ds-combat-families.js'
      - 'tests/combat-balance*.cjs'
      - 'tests/beta-fusion-native-browser.cjs'
      - 'scripts/build-eternamax-qa.cjs'
      - 'tests/eternamax*.cjs'
      - 'src/pkmsvv-box-hub-ui.js'
      - 'src/pkmsvv-box-hub.js'
      - 'src/pkmsvv-wisdom-qa.js'
      - 'tests/wisdom*.cjs'
      - 'tests/blank-tm-browser.cjs'
      - 'tests/pokebox-hub.test.cjs'
      - 'src/pkmsvv-box-stage2.js'
      - 'src/pkmsvv-recruitment-qa.js'
      - 'tests/pokebox-stage2.test.cjs'
      - 'tests/recruitment-egg-browser.cjs'
      - 'src/cloudflare/save-guardian.js'
      - 'tests/dex-defeats-qa.test.cjs'
      - 'tests/quick-region.test.cjs'
      - 'tests/save-guardian-regression.test.cjs'
      - 'scripts/patch-berry-coop.cjs'
      - 'tests/berry-rescue.test.cjs'
      - 'tests/big-update-progression*.cjs'
      - '.github/workflows/big-update-progression-qa.yml'
      - 'scripts/prepare-game.cjs'
      - 'scripts/prepare-lan.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  progression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PKMSVV_FOSSIL_NATIVE_QA: '1'
      PKMSVV_STANDALONE_AI: '1'
      PKMSVV_BETA_176_SKILLS_QA: '1'
      PKMSVV_BIG_UPDATE_QA: '1'
      PKMSVV_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact original upstream commit via verified public mirror
        shell: bash
        run: |
          set -euo pipefail
          PIN=11fe868c640b62ac37beacc222e056bc4d9ec892
          TREE=0a36feb1d9639efd7383bf30d1bfb08830dd8c6e
          mkdir -p vendor/pokesurvivor
          git -C vendor/pokesurvivor init
          # JPTER78/pokesurvivor currently returns 404. Both mirrors retain
          # exactly the same immutable commit and tree, not a later fork HEAD.
          for mirror in             https://github.com/ovolee37/pokesurvivor-ayn-thor.git             https://github.com/Tpg590/Pokemon.git; do
            if git -C vendor/pokesurvivor -c credential.interactive=never fetch --depth=1 "$mirror" "$PIN"; then
              break
            fi
          done
          test "$(git -C vendor/pokesurvivor rev-parse FETCH_HEAD)" = "$PIN"
          git -C vendor/pokesurvivor checkout --detach "$PIN"
          test "$(git -C vendor/pokesurvivor rev-parse HEAD^{tree})" = "$TREE"
          test -s vendor/pokesurvivor/dev.html
          test -s vendor/pokesurvivor/LICENSE-NONCOMMERCIAL.md
          echo "PINNED_UPSTREAM_RESTORED=$PIN TREE=$TREE"
      - name: Install build dependencies with known-published transitive ABI version
        shell: bash
        run: |
          set -euo pipefail
          # npm's unpinned transitive registry metadata currently advertises
          # node-abi@4.42.0 whose tarball returns 404. Limit this override to
          # the ephemeral Beta GitHub runner; no package or save changes.
          npm pkg set 'overrides.node-abi=4.40.0'
          npm install --no-audit --no-fund
      - name: Unit progression and existing save protection
        run: node --test tests/big-update-progression.test.cjs tests/save-guardian-regression.test.cjs tests/web-save-guardian-v2.test.cjs tests/special-power-qa.test.cjs tests/berry-rescue.test.cjs tests/dex-defeats-qa.test.cjs tests/p0-transactions.test.cjs tests/progression-merge.test.cjs tests/egg-rush-hidden-score.test.cjs tests/egg-rush-shiny.test.cjs tests/support-expansion.test.cjs tests/pokebox-stage2.test.cjs tests/eternamax.test.cjs tests/pokebox-hub.test.cjs tests/wisdom.test.cjs tests/combat-balance.test.cjs tests/combat-tactics.test.cjs tests/lan-ai-modes.test.cjs tests/horde-performance.test.cjs tests/bond-fusion-svv.test.cjs
      - name: Rift identity and final victory regressions
        run: node --test --test-name-pattern="Rift legendary keeps|final victory retries" tests/quick-region.test.cjs
      - name: Fetch required existing Clefairy assets
        run: node scripts/fetch-pippi-pmd.cjs && node scripts/build-pippi-portrait-atlas.cjs
      - name: Compile real offline game
        id: compile
        run: npm run prepare:lan
      - name: Native support inventory and Jirachi timed buffs
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: timeout 90s node tests/support-expansion-browser.cjs
      - name: Native Shop and Mega purchase failure, stale tab and reload
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: timeout 100s node tests/p0-transactions-browser.cjs
      - name: Native Recruitment 100 pulls, atomic failure and prize overflow
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: timeout 100s node tests/recruitment-egg-browser.cjs
      - name: Native Blank TM shop, individual deletion, merge and Wisdom card
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: timeout 100s node tests/blank-tm-browser.cjs
      - name: Native 176-move catalogue audit, damage progression and boss control recovery
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: timeout 100s node tests/combat-balance-browser.cjs
      - name: Native Surf and Electric resonance after balance
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: timeout 90s node tests/beta-fusion-native-browser.cjs
      - name: Native bot evasion, real rescue, status display and eight-move horde sample
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: timeout 120s node tests/combat-tactics-browser.cjs
      - name: Native Galar 15m and Eternamax 30m real two-phase combat
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: timeout 100s node tests/eternamax-browser.cjs
      - name: Native Explore kill, result settlement, research lab hatch, compiled roster
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: timeout 220s node tests/big-update-progression-browser.cjs
      - name: Native Egg Rush four-slot rank prizes, result reveal and reload
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: timeout 210s node tests/egg-rush-rank-prize-browser.cjs
      - name: Real two-client Wi-Fi survival progression and weekly mission
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: timeout 220s node tests/big-update-progression-coop-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: big-update-progression-qa
          path: |
            dist/big-update-progression-qa/
            dist/fusion-native-qa/
          if-no-files-found: warn
          retention-days: 7
