name: PokéSurvivor Web original G-Max source audit
on:
  push:
    branches: [feature/gmax-power-qa-20261127]
    paths:
      - 'scripts/audit-pokesurvivor-web-gmax.cjs'
      - 'tests/pokesurvivor-web-gmax-audit.test.cjs'
      - '.github/workflows/pokesurvivor-web-gmax-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/pokesurvivor-web-gmax-audit.test.cjs
      - run: node scripts/audit-pokesurvivor-web-gmax.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pokesurvivor-web-gmax-audit
          path: dist/pokesurvivor-web-gmax-audit/
          if-no-files-found: warn
          retention-days: 7
