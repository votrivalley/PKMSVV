name: Build Android FULL Game + Co-op LAN Beta
on:
  push:
    branches: [feature/lan-local-beta]
    paths:
      - 'tests/mega-lucario.test.cjs'
      - 'src/pkmsvv-mega-lucario.js'
      - 'scripts/build-mega-lucario.cjs'
      - 'scripts/patch-mega-lucario.cjs'
      - 'config/android-signing-identity.json'
      - 'scripts/verify-android-signing.cjs'
      - 'tests/android-signing-identity.test.cjs'
      - 'scripts/bundle-wifi-qr.cjs'
      - 'scripts/patch-lan.cjs'
      - 'scripts/prepare-full-lan-android.cjs'
      - 'scripts/compile-standalone-ai.cjs'
      - 'scripts/patch-lan-ai.cjs'
      - 'scripts/patch-arena-v1529.cjs'
      - 'src/web/pkmsvv-arena.js'
      - 'src/web/pkmsvv-match-metrics.js'
      - 'tests/arena-v1529*.cjs'
      - 'tests/spawn-arena-v1529.test.cjs'
      - 'src/web/pkmsvv-egg-rush.js'
      - 'src/web/pkmsvv-royale.js'
      - 'scripts/package-standalone-ai.cjs'
      - 'scripts/configure-android-full-lan.cjs'
      - 'scripts/configure-android-stable-signing.cjs'
      - 'tests/android-stable-signing.test.cjs'
      - 'src/android/**'
      - 'src/pkmsvv-story.js'
      - 'scripts/patch-story.cjs'
      - 'src/lan/**'
      - 'src/shared/**'
      - 'tests/coop-icon-consistency.test.cjs'
      - 'tests/unified-coop.test.cjs'
      - 'tests/local-shell-ui.test.cjs'
      - 'tests/local-ui-lan-host-regression.test.cjs'
      - 'tests/android-full-lan.test.cjs'
      - 'tests/coop-platform-browser.cjs'
      - 'tests/competitive-rewards.test.cjs'
      - 'tests/dex-header-actions.test.cjs'
      - 'tests/starter-onboarding-browser.cjs'
      - 'tests/v15-gacha-save-isolation.test.cjs'
      - '.github/workflows/build-android-full-lan.yml'
      - 'scripts/prepare-game.cjs'
      - 'scripts/prepare-android.cjs'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-full-lan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check permanent Android update signing
        id: stable_signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PKMSVV_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PKMSVV_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PKMSVV_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PKMSVV_ANDROID_KEY_PASSWORD }}
        run: |
          configured=0
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -n "$value" ]; then configured=$((configured+1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "::error::No permanent Android key configured; refusing debug fallback."
            exit 1
          elif [ "$configured" -ne 4 ]; then
            echo "::error::Incomplete permanent Android signing secrets. Set all four secrets together."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Android SDK 36
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Fetch pinned upstream full game
        shell: bash
        run: |
          git init vendor/pokesurvivor
          git -C vendor/pokesurvivor remote add origin https://github.com/JPTER78/pokesurvivor.git
          git -C vendor/pokesurvivor fetch --depth 1 origin 11fe868c640b62ac37beacc222e056bc4d9ec892
          git -C vendor/pokesurvivor checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate stable Android signing guardrails
        run: node --test tests/android-stable-signing.test.cjs tests/android-signing-identity.test.cjs
      - name: Compile entire modified offline game
        run: npm run prepare:game
      - name: Validate original game and save functionality
        run: npm run test:v15 && npm run test:collection && npm run test:mobile-topbar && npm run test:mega
      - name: Pack full offline assets and LAN UI
        run: |
          npm run prepare:icons
          npm run prepare:android
          npm run test:android
          npm run prepare:android:full-lan
          npm run test:android:full-lan
          node --test tests/coop-icon-consistency.test.cjs tests/unified-coop.test.cjs
          node --test tests/local-shell-ui.test.cjs
      - name: Verify personal tickets and Shiny ownership in Android LAN AI
        run: node --test tests/competitive-rewards.test.cjs
      - name: Verify Android packaged menu and all three local AI modes in browser
        shell: bash
        run: PKMSVV_PLATFORM=android PKMSVV_BROWSER="$(command -v google-chrome)" node tests/coop-platform-browser.cjs
      - name: QA actual Android skip-intro / skip-quiz / starter selection
        shell: bash
        run: PKMSVV_PLATFORM=android PKMSVV_BROWSER="$(command -v google-chrome)" node tests/starter-onboarding-browser.cjs
      - name: Verify P0 arena support nests and opening spawns
        run: node --test tests/arena-v1529.test.cjs tests/spawn-arena-v1529.test.cjs tests/lan-bot-snapshot.test.cjs tests/wifi-qr-license.test.cjs
      - name: Android P0 2/4/10-trainer browser stress smoke (short CI, full soak manually)
        shell: bash
        env:
          PKMSVV_SOAK_MS: '12000'
        run: PKMSVV_PLATFORM=android PKMSVV_BROWSER="$(command -v google-chrome)" node tests/arena-v1529-soak.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PKMSVV-P0-v1529-QA-Android-Assets
          path: dist/qa/v1529-*
          if-no-files-found: ignore
      - name: Create Capacitor Android and LAN native screen
        run: |
          npx cap add android
          npx cap sync android
          node scripts/configure-android.cjs
          node scripts/configure-android-full-lan.cjs
          node scripts/apply-android-icons.cjs
      - name: Validate game and manifest
        shell: bash
        run: |
          grep -q 'com.votrivalley.pkmsvv.fulllan' android/app/build.gradle
          grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'LANRoomActivity' android/app/src/main/AndroidManifest.xml
          test -s mobile/www/js/app.min.js
          test -s mobile/www/js/ui/pkmsvv-full-lan-ui.js
          test ! -e mobile/www/ai/game/index.html
          grep -q 'pkmsvv-android-root-config.js' mobile/www/index.html
          grep -q 'PKMSVV_ANDROID_LOCAL_LAN=true' mobile/www/js/ui/pkmsvv-android-root-config.js
          grep -q 'PKMSVV_STANDALONE_AI' mobile/www/js/app.min.js
          du -sh mobile/www/assets
      - name: Build updateable signed Android FULL LAN release APK
        if: steps.stable_signing.outputs.ready == 'true'
        shell: bash
        env:
          PKMSVV_ANDROID_KEYSTORE_BASE64: ${{ secrets.PKMSVV_ANDROID_KEYSTORE_BASE64 }}
          PKMSVV_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PKMSVV_ANDROID_KEYSTORE_PASSWORD }}
          PKMSVV_ANDROID_KEY_ALIAS: ${{ secrets.PKMSVV_ANDROID_KEY_ALIAS }}
          PKMSVV_ANDROID_KEY_PASSWORD: ${{ secrets.PKMSVV_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export PKMSVV_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/pkmsvv-full-lan-stable.jks"
          trap 'rm -f "$PKMSVV_ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$PKMSVV_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PKMSVV_ANDROID_KEYSTORE_FILE"
          test -s "$PKMSVV_ANDROID_KEYSTORE_FILE"
          node scripts/verify-android-signing.cjs --keystore
          node scripts/configure-android-stable-signing.cjs
          (cd android && ./gradlew --no-daemon :app:assembleRelease)
          version=$(node -p "require('./package.json').version")
          mkdir -p dist/stable-android
          apk="dist/stable-android/PKMSVV-${version}-Android-FULL-LAN-UPDATE.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$apk" | grep '^package:' | head -1
          unzip -t "$apk" | tail -1
          unzip -Z -1 "$apk" > "$RUNNER_TEMP/pkmsvv-apk-contents.txt"
          grep -q '^assets/public/js/app.min.js$' "$RUNNER_TEMP/pkmsvv-apk-contents.txt"
          grep -q '^assets/public/js/ui/pkmsvv-full-lan-ui.js$' "$RUNNER_TEMP/pkmsvv-apk-contents.txt"
          node scripts/verify-android-signing.cjs --apk "$apk"
          echo "Signed update APK created for package com.votrivalley.pkmsvv.fulllan."
      - uses: actions/upload-artifact@v4
        if: steps.stable_signing.outputs.ready == 'true'
        with:
          name: PKMSVV-Android-FULL-LAN-SIGNED-UPDATE
          path: dist/stable-android/*.apk
          retention-days: 14
          if-no-files-found: error
