name: Publish Offline HTML5 to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pkmsvv-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load pinned upstream game
        shell: bash
        run: |
          git init vendor/pokesurvivor
          git -C vendor/pokesurvivor remote add origin https://github.com/JPTER78/pokesurvivor.git
          git -C vendor/pokesurvivor fetch --depth 1 origin 11fe868c640b62ac37beacc222e056bc4d9ec892
          git -C vendor/pokesurvivor checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build complete HTML5 and test project paths
        run: npm run prepare:pages && npm run test:pages && node --test tests/local-shell-ui.test.cjs
      - name: Check complete assets
        shell: bash
        run: |
          test -s dist/pages/index.html
          test -s dist/pages/sw.js
          test -s dist/pages/game/js/app.min.js
          test -s dist/pages/game/assets/icons/icon-180.png
          du -sh dist/pages
      - name: Upload Pages website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy game website
        id: deployment
        uses: actions/deploy-pages@v4
