name: PKMSVV 3DS Alpha09.7 - Eight-slot Fusion native CIA + 3DSX
on:
  workflow_dispatch:
  push:
    branches:
      - feature/3ds-fusion8-alpha097-20261121
    paths:
      - .github/workflows/build-3ds-fusion097.yml
      - tools/3ds-native/**
permissions:
  contents: read
concurrency:
  group: pkmsvv-native-fusion097
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout only the isolated PKMSVV build harness
        uses: actions/checkout@v4
      - name: Fetch pinned open source 3DS engine v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.0.0 https://github.com/juanluismm521/pokesurvivor3ds.git native-3ds
          test "$(git -C native-3ds rev-parse HEAD)" = "7468ec9ba88c374a9b51230c6c8ae481e3bb0ce2"
          test -s native-3ds/LICENSE
          test -s native-3ds/LICENSE-NONCOMMERCIAL.md
          test -s native-3ds/CREDITS.md
      - name: Download and verify official matching v1.0.0 homebrew CIA assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 4 --output "$RUNNER_TEMP/source-v1.0.0.cia" \
            https://github.com/juanluismm521/pokesurvivor3ds/releases/download/v1.0.0/pokesurvivor-3ds.cia
          echo "b1f24b348660e0f32a7395157b89046051eead87215535d428f9045bc4b75199  $RUNNER_TEMP/source-v1.0.0.cia" | sha256sum -c -
          python3 tools/3ds-native/extract_romfs.py "$RUNNER_TEMP/source-v1.0.0.cia" native-3ds/romfs \
            --sha256 b1f24b348660e0f32a7395157b89046051eead87215535d428f9045bc4b75199
          test -s native-3ds/romfs/spr/report.json
          test -s native-3ds/romfs/credits_en.txt
      - name: Isolate Title ID, save directory, services and offline QA banner
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/3ds-native/isolate_qa.py native-3ds
          python3 tools/3ds-native/port_slice01_kanto.py native-3ds
          python3 tools/3ds-native/port_slice02_kanto_runtime.py native-3ds
          python3 tools/3ds-native/port_slice02_ui_vi.py native-3ds
          python3 tools/3ds-native/port_slice02_live_qa.py native-3ds
          python3 tools/3ds-native/port_slice03_region_story.py native-3ds
          python3 tools/3ds-native/port_slice03_kanto_backdrop.py native-3ds
          python3 tools/3ds-native/port_slice04_badge_timeline.py native-3ds
          python3 tools/3ds-native/port_slice04_gate_test.py native-3ds
          python3 tools/3ds-native/port_slice05_johto.py native-3ds
          python3 tools/3ds-native/port_slice06_hoenn.py native-3ds
          python3 tools/3ds-native/port_slice065_explore_speed.py native-3ds
          python3 tools/3ds-native/port_slice07_sinnoh.py native-3ds
          python3 tools/3ds-native/port_slice08_unova.py native-3ds
          python3 tools/3ds-native/port_slice09_kalos.py native-3ds
          python3 tools/3ds-native/port_slice095_skill_parity.py native-3ds
          python3 tools/3ds-native/port_slice095_skill_qa.py native-3ds
          python3 tools/3ds-native/port_slice096_web_skill_slots.py native-3ds
          python3 tools/3ds-native/port_slice096_skill8_qa.py native-3ds
          python3 tools/3ds-native/port_slice097_fusion8_qa.py native-3ds
          python3 tools/3ds-native/qa_sprite096.py native-3ds/romfs/spr --out native-3ds/pkmsvv-sprite-source-audit-096.json
          grep -Fq 'PKMSVV_SKILL096_EIGHT_SETUP_' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'PKMSVV_FUSION097_SETUP_' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'PKMSVV_FUSION097_RUNTIME_' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'PKMSVV_SKILL096_EIGHT_RUNTIME_' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'pkmsvv_apply_web_cd' native-3ds/src/core/player.cpp
          grep -Fq 'slot_n[8]' native-3ds/src/core/game.h
          grep -Fq 'PKMSVV_SKILL095_RUNTIME_' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'pkmsvv_dash_auto' native-3ds/src/core/combat.cpp
          grep -Fq 'pkmsvv_dash_requested' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'GIỮ 2s: AUTO' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'pkmsvv_save_kalos_badge' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'pkmsvv_load_kalos_badge' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'region_selected_ == 5' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'pkmsvv_region_index == 5 ? 718' native-3ds/src/core/enemies.cpp
          grep -Fq 'final->dex == (at.pk_kalos_qa ? 718' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'PKMSVV_REGION09_CAST_' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'pkmsvv_save_unova_badge' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'pkmsvv_load_unova_badge' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'region_selected_ == 4' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'pkmsvv_region_index == 4 ? 646' native-3ds/src/core/enemies.cpp
          grep -Fq 'final->dex == (at.pk_kalos_qa ? 718' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'PKMSVV_REGION09_CAST_' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'pkmsvv_save_sinnoh_badge' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'region_selected_ == 3' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'pkmsvv_explore_speed_allowed' native-3ds/src/platform/3ds/app_coop.cpp
          grep -Fq 'final->dex == (at.pk_kalos_qa ? 718' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'pkmsvv_speed_1p5_' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'acc += double(dt) * 500.0' native-3ds/src/platform/3ds/app_coop.cpp
          grep -Fq 'PKMSVV_SPEED_REALTIME_' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'in_rect(&in, 250, 58, 62, 24)' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'PKMSVV_REGION09_CAST_' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'pkmsvv_load_hoenn_badge' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'g.cfg.pkmsvv_region_gen' native-3ds/src/core/enemies.cpp
          grep -Fq 'at.pk_hoenn_qa ? 385' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'PKMSVV_REGION09_CAST_' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'pkmsvv_region_gen' native-3ds/src/core/enemy.cpp
          grep -Fq 'pkmsvv_load_johto_badge' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'g.cfg.pkmsvv_region_gen' native-3ds/src/core/enemies.cpp
          grep -Fq 'final->dex == (at.pk_kalos_qa ? 718' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'PKMSVV_REGION04_GATE_AFTER_' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'PKMSVV_REGION_V1' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'pkmsvv_final_boss_id' native-3ds/src/core/enemy.cpp
          grep -Fq 'pkmsvv_badge_claimed && !g.boss_alive()' native-3ds/src/core/spawner.cpp
          grep -Fq 'PKMSVV_REGION04_FINAL_GATE_' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'PKM_KANTO_WALKERS' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'scene != SC_PKM_REGION' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'go(SC_PKM_REGION)' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'go(SC_PKM_STORY)' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'pkmsvv_native_region_playable(pick)' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'kPKMSVVRegionCount = 10' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'region_selected_ == 5 || autotest' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'if (g.cfg.kanto_only)' native-3ds/src/core/enemy.cpp
          grep -Fq 'g.nbosses = 2' native-3ds/src/core/enemies.cpp
          grep -Fq 'if (!cfg.kanto_only)' native-3ds/src/core/game.cpp
          grep -Fq 'PKMSVV_REGION09_LIVE_' native-3ds/src/platform/3ds/main.cpp
          grep -Fq 'cfg.kanto_only' native-3ds/src/platform/3ds/app.cpp
          grep -Fq 'g.cfg.kanto_only' native-3ds/src/core/enemies.cpp
          cp tools/3ds-native/qa_banner.py native-3ds/tools/cia/gen_banner.py
          grep -Fq 'UniqueId                : 0xF5B14' native-3ds/tools/cia/app.rsf
          grep -Fq 'sdmc:/3ds/pkmsvv-kanto01' native-3ds/src/platform/3ds/main.cpp
          ! grep -Fq 'https://pokesurvivor3ds.duckdns.org' native-3ds/src/platform/3ds/datos3ds.cpp
          ! grep -Fq 'https://pokesurvivor3ds.duckdns.org' native-3ds/src/platform/3ds/cloud3ds.cpp
      - name: Compile genuine 3DSX with official devkitARM container
        shell: bash
        run: |
          set -euo pipefail
          docker pull devkitpro/devkitarm:latest
          docker run --rm \
            --env PS_BUILD_N=1 \
            --volume "$PWD/native-3ds:/work" --workdir /work \
            devkitpro/devkitarm:latest /bin/bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends python3 python3-pil python3-fonttools fonts-dejavu-core curl unzip ca-certificates
              python3 tools/cia/gen_banner.py build/cia
              source tools/env.sh
              python3 tools/gen_font.py
              make -j2
            '
          test -s native-3ds/pkmsvv-kanto01.3dsx
          test -s native-3ds/pkmsvv-kanto01.elf
          # Docker builds as root; restore ownership for the runner's makerom/bannertool.
          sudo chown -R "$(id -u):$(id -g)" native-3ds
      - name: Package CIA using runner glibc 2.38+ (not older devkit container)
        shell: bash
        run: |
          set -euo pipefail
          cd native-3ds
          mkdir -p tools/cache/cia
          cd tools/cache/cia
          curl --fail --location --retry 3 -o makerom.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          unzip -oq makerom.zip
          chmod +x makerom
          curl --fail --location --retry 3 -o bannertool.zip \
            https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -oq bannertool.zip -d bt
          chmod +x bt/linux-x86_64/bannertool
          cd ../../..
          test -s build/cia/banner.png
          test -s build/cia/banner.wav
          tools/cache/cia/bt/linux-x86_64/bannertool makebanner \
            -i build/cia/banner.png -a build/cia/banner.wav -o build/cia/banner.bnr
          tools/cache/cia/bt/linux-x86_64/bannertool makesmdh \
            -s "PKMSVV Region 0.9" -l "Kalos Gen6 - Fusion 8 Slot QA"  \
            -p "Votri Valley" -i assets-src/icon-48.png -o build/cia/icon.icn
          tools/cache/cia/makerom -f cia -o pkmsvv-kanto01.cia \
            -target t -exefslogo -elf pkmsvv-kanto01.elf -rsf tools/cia/app.rsf \
            -icon build/cia/icon.icn -banner build/cia/banner.bnr -major 0 -micro 1
          test "$(stat -c %s pkmsvv-kanto01.cia)" -gt 10000000
          sha256sum pkmsvv-kanto01.3dsx pkmsvv-kanto01.cia
      - name: Check CIA does not overwrite original PokéSurvivor Title ID
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,struct
          p=pathlib.Path('native-3ds/pkmsvv-kanto01.cia').read_bytes()
          idx=p.index(b'NCCH')
          base=idx-0x100
          assert base>0
          # NCCH product code is signed metadata, confirm the fork identity.
          assert b'CTR-H-PK01' in p[base:base+0x200], 'Fork ProductCode missing'
          assert b'CTR-H-PSV3' not in p[base:base+0x200], 'Original ProductCode unexpectedly retained'
          print('PKMSVV_3DS_FUSION097_CIA_IDENTITY_PASS')
          PY
      - name: Verify 5–8 HUD source geometry and touch parity (not physical touch)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          g=Path("native-3ds/src/core/game.h").read_text()
          r=Path("native-3ds/src/platform/3ds/render.cpp").read_text()
          a=Path("native-3ds/src/platform/3ds/app.cpp").read_text()
          assert "int8_t slots[8][4]" in g and "int8_t slot_n[8]" in g
          for src in (r,a):
              assert "compact ? 27.0f" in src
              assert "compact ? 3.0f" in src
              assert "me.nslots>4" in src or "p.nslots>4" in src
          for n in range(5,9):
              slot=27.0; gap=3.0
              left=(320-(n*slot+(n-1)*gap))/2
              right=left+n*slot+(n-1)*gap
              assert left>=40 and right<=280, (n,left,right)
          print("PKMSVV_FUSION097_HUD_GEOMETRY_SOURCE_PASS")
          PY
      - name: Azahar 30s real native Fusion chain (8 moves to 7 to 6 slots)
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: xcb
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb imagemagick python3-pil libgl1-mesa-dri libfuse2t64 \
            libxcb-cursor0 libxkbcommon-x11-0 libegl1 libopengl0 \
            libpulse0 libasound2t64 libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            ca-certificates curl
          mkdir -p qa-fusion097
          curl --fail --location --retry 3 --retry-delay 3 \
            https://github.com/azahar-emu/azahar/releases/download/2126.2/azahar.AppImage \
            --output qa-fusion097/azahar.AppImage
          chmod +x qa-fusion097/azahar.AppImage
          (cd qa-fusion097 && ./azahar.AppImage --appimage-extract >/dev/null)
          test -x qa-fusion097/squashfs-root/AppRun
          export DISPLAY=:94
          export HOME="$RUNNER_TEMP/fusion097-home"
          d="$HOME/.local/share/azahar-emu/sdmc/3ds/pkmsvv-kanto01"
          mkdir -p "$d"
          printf 'fusion8qa\n' > "$d/autotest.txt"
          Xvfb :94 -screen 0 1280x800x24 > qa-fusion097/xvfb.log 2>&1 &
          sleep 3
          set +e
          timeout --signal=TERM --kill-after=5 115 \
            qa-fusion097/squashfs-root/AppRun "$PWD/native-3ds/pkmsvv-kanto01.3dsx" \
            > qa-fusion097/azahar.stdout 2>&1
          code=$?
          set -e
          echo "AZAHAR_FUSION097_PROCESS_EXIT=$code"
          test -s "$d/autotest.log" || (tail -n 80 qa-fusion097/azahar.stdout; exit 1)
          cp "$d/autotest.log" qa-fusion097/autotest-fusion8.log
          tail -n 40 qa-fusion097/autotest-fusion8.log
          grep -q '^PKMSVV_SKILL096_EIGHT_SETUP_PASS' qa-fusion097/autotest-fusion8.log
          grep -q '^PKMSVV_FUSION097_SETUP_PASS' qa-fusion097/autotest-fusion8.log
          grep -q '^PKMSVV_FUSION097_RUNTIME_PASS' qa-fusion097/autotest-fusion8.log
          grep -q '^PKMSVV_SKILL096_EIGHT_RUNTIME_PASS' qa-fusion097/autotest-fusion8.log
          grep -q '^FIN · 30 s' qa-fusion097/autotest-fusion8.log
          ! grep -Eq '^PKMSVV_(FUSION097|SKILL096_EIGHT)_(SETUP|RUNTIME)_FAIL' qa-fusion097/autotest-fusion8.log
          case "$code" in 0|124|137) ;; *) echo "Azahar exited unexpectedly: $code"; exit 1;; esac
          echo PKMSVV_FUSION097_REAL_ENGINE_QA_PASS
      - name: Upload isolated native engine QA artifacts (never a public release)
        uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-3DS-FUSION8-ALPHA097
          path: |
            native-3ds/pkmsvv-kanto01.3dsx
            native-3ds/pkmsvv-kanto01.cia
            native-3ds/pkmsvv-sprite-source-audit-096.json
            qa-fusion097/autotest-fusion8.log
            qa-fusion097/azahar.stdout
            qa-fusion097/xvfb.log
            native-3ds/LICENSE
            native-3ds/LICENSE-NONCOMMERCIAL.md
            native-3ds/CREDITS.md
          retention-days: 7
          if-no-files-found: error
