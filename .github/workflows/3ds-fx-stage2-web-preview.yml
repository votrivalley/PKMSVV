name: PKMSVV 3DS Effects - Mirror Compiled Web Preview QA
on:
  push:
    branches:
      - feature/web-3ds-skill-effects-passives-qa-20261121
    paths:
      - .github/workflows/3ds-fx-stage2-web-preview.yml
      - src/pkmsvv-3ds-move-families.js
      - src/pkmsvv-3ds-combat-families.js
      - src/pkmsvv-3ds-skill-port.js
      - scripts/patch-3ds-move-families.cjs
      - scripts/patch-3ds-skill-effects-passives.cjs
      - scripts/prepare-game.cjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pkmsvv-3ds-fx-stage2-compiled-web-qa
  cancel-in-progress: true
jobs:
  real-web-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: QA smoke before modifying any source
        run: |
          node --check src/pkmsvv-3ds-skill-port.js
          node --check src/pkmsvv-3ds-move-families.js
          node --check src/pkmsvv-3ds-combat-families.js
          node --test tests/3ds-fx-passives-shared.test.cjs tests/3ds-move-families-shared.test.cjs
      - name: Fetch pinned public Web source mirror for isolated QA (NOT official release source)
        shell: bash
        run: |
          set -euo pipefail
          git init vendor/pokesurvivor
          git -C vendor/pokesurvivor remote add origin https://github.com/botgm/PokeSurvivor.git
          git -C vendor/pokesurvivor fetch --depth 1 origin 3959a3f19c1c9842e860595317d792ae09572846
          git -C vendor/pokesurvivor checkout --detach FETCH_HEAD
          test -s vendor/pokesurvivor/dev.html
          test -s vendor/pokesurvivor/LICENSE-NONCOMMERCIAL.md
      - name: Install build deps without publishing packages
        run: npm install --no-audit --no-fund
      - name: Build shared gameplay engine from public-mirror source into QA-only Web preview
        env:
          PKMSVV_WEB_PREVIEW: '1'
        run: npm run prepare:web
      - name: Validate compiled game includes live 3DS combat and keeps save identity
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/web/index.html
          test -s dist/web/game/index.html
          test -s dist/web/game/js/app.min.js
          test -d dist/web/game/assets
          test -s vendor/pokesurvivor/js/systems/pkmsvv-3ds-move-families.js
          test -s vendor/pokesurvivor/js/systems/pkmsvv-3ds-combat-families.js
          grep -Fq 'whirlpool' dist/web/game/js/app.min.js
          grep -Fq 'earthquake' dist/web/game/js/app.min.js
          grep -Fq 'rapid-spin' dist/web/game/js/app.min.js
          grep -Fq 'PKMSVV3DSCombatFX' dist/web/game/js/app.min.js
          node --check dist/web/game/js/app.min.js
          node --test tests/3ds-fx-passives-shared.test.cjs tests/3ds-move-families-shared.test.cjs
          echo PKMSVV_3DS_EFFECTS_REAL_WEB_BUILD_QA_PASS
      - name: Upload preview build (NEVER deploy or sign)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-3DS-SKILL-EFFECTS-MIRROR-WEB-PREVIEW-QA
          path: dist/web/
          retention-days: 5
          if-no-files-found: error
