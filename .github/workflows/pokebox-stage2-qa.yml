name: Pokebox Stage 3 isolated QA artifact
on:
  push:
    branches:
      - feature/pokebox-stage1-isolated-qa
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-qa-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PKMSVV_MEGA_SPRITE_PACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run PokéBox unit tests
        run: npm run test:pokebox:stage3
      - name: Retrieve previously successful Web v1.5.93 build artifact
        uses: actions/download-artifact@v4
        with:
          name: PKMSVV-Cloudflare-Pages-FULL-HTML5
          run-id: 41693288005
          github-token: ${{ github.token }}
          path: dist/cloudflare
      - name: Create isolated Stage 3 Web QA bundle
        run: node scripts/build-pokebox-stage1-qa.cjs
      - name: Verify QA scripts, game and save isolation
        run: |
          test -s dist/pokebox-stage3-qa/ai/game/index.html
          test -s dist/pokebox-stage3-qa/ai/game/js/ui/pkmsvv-box-stage2.js
          test -s dist/pokebox-stage3-qa/ai/game/js/ui/pkmsvv-box-stage2-ui.js
          test -s dist/pokebox-stage3-qa/ai/game/js/ui/pkmsvv-box-stage3.js
          test -s dist/pokebox-stage3-qa/ai/game/css/pkmsvv-box-stage3.css
          grep -q pkmsvv-box-stage3 dist/pokebox-stage3-qa/ai/game/index.html
          test -s dist/pokebox-stage3-qa/game/js/app.min.js
      - name: Check all Stage 3 scripts compile
        run: |
          node --check src/pkmsvv-box-stage2.js
          node --check src/pkmsvv-box-stage2-ui.js
          node --check src/pkmsvv-box-stage3.js
          node --check tests/pokebox-stage3.test.cjs
          node --check tests/pokebox-stage2-browser.cjs
      - name: Real Chromium smoke of isolated Web QA injection
        run: node tests/pokebox-stage2-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-PokeBox-Stage3-Web-QA-ONLY
          path: dist/pokebox-stage3-qa
          retention-days: 14
          if-no-files-found: error
