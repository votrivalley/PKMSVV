name: Pokebox Stage 4 isolated Windows QA artifact
on:
  push:
    branches:
      - feature/pokebox-stage1-isolated-qa
      - release/pokemon-chuyen-sinh-2.0-web
    paths:
      - 'src/pkmsvv-fusion-evolved.js'
      - 'src/pkmsvv-horde-performance.js'
      - 'src/pkmsvv-quick-region.js'
      - 'src/pkmsvv-runtime-controls-qa.js'
      - 'src/pkmsvv-box-hub.js'
      - 'src/pkmsvv-box-hub-ui.js'
      - 'src/kecleon/upstream/data/shop.js'
      - 'src/kecleon/pkmsvv-kecleon-ui.js'
      - 'tests/v20-items-release.test.cjs'
      - 'tests/horde-performance.test.cjs'
      - 'tests/quick-region.test.cjs'
      - 'tests/bond-fusion-svv.test.cjs'
      - 'scripts/build-pokebox-stage1-pc-qa.cjs'
      - 'scripts/patch-qa-compiled-modules.cjs'
      - '.github/workflows/pokebox-stage2-pc-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package-pc-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Stage 1 and Stage 1/2/3 save/regression tests
        run: npm run test:pokebox:stage4 && npm run test:quick-region && node --test tests/held-item-choice.test.cjs tests/modal-input-qa.test.cjs && node --test tests/bond-fusion-svv.test.cjs tests/horde-performance.test.cjs tests/pokebox-hub.test.cjs tests/kecleon.test.cjs tests/runtime-controls-qa.test.cjs tests/v20-items-release.test.cjs
      - name: Download successful signed v1.5.93 Windows baseline
        uses: actions/download-artifact@v4
        with:
          name: PKMSVV-LAN-Windows-Unpacked-Debug
          run-id: 41693287957
          github-token: ${{ github.token }}
          path: dist/lan-windows/win-unpacked
      - name: Build isolated Windows PokéBox QA folder
        run: node scripts/build-pokebox-stage1-pc-qa.cjs
      - name: Verify PC game and isolated save identity
        run: |
          test -s dist/pokebox-stage4-pc-qa/resources/app.asar
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-box-stage2.js
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-box-stage2-ui.js
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-box-stage3.js
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-box-stage4.js
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-box-hub.js
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-box-hub-ui.js
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/css/pkmsvv-box-hub.css
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-fusion-evolved.js
          grep -q 'installVisualBudget' dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-fusion-evolved.js
          grep -q 'PKMSVVHordePerformance' dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-horde-performance.js
          grep -q 'input.axis=()=>aim' dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-runtime-controls-qa.js
          grep -q 'speedOwnerSafe' dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-runtime-controls-qa.js
          grep -q 'pickRandom' dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-box-hub.js
          grep -Fq "const ORDER = ['mint', 'cap']" dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/app.min.js
          grep -q 'pkmsvv-horde-performance.js' dist/pokebox-stage4-pc-qa/resources/lan-site/game/index.html
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/css/pkmsvv-fusion-evolved.css
          for id in ember-quick water-tackle grass-spin spark-quick mind-tackle fire-gust bubble-ice leaf-rock shadow-mind thunder-claw; do
            test -s "dist/pokebox-stage4-pc-qa/resources/lan-site/game/assets/fusion-icons/${id}.webp"
          done
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-quick-region.js
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/css/pkmsvv-quick-region.css
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-pc-menu-clean-qa.js
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/css/pkmsvv-pc-menu-clean-qa.css
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/images/pkmsvv-menu-icons.webp
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-modal-navigation-qa.js
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/css/pkmsvv-modal-navigation-qa.css
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/js/ui/pkmsvv-runtime-controls-qa.js
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/css/pkmsvv-runtime-controls-qa.css
          test -s dist/pokebox-stage4-pc-qa/resources/lan-site/game/css/pkmsvv-box-stage3.css
          grep -q pkmsvv-box-stage4 dist/pokebox-stage4-pc-qa/resources/lan-site/game/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-PokeBox-Stage4-Windows-QA-ONLY
          path: dist/pokebox-stage4-pc-qa
          retention-days: 14
          if-no-files-found: error
