name: Switch Native Demo (nx.js - no Brewser)
on:
  push:
    branches: [feature/switch-native-nxjs-demo]
    paths:
      - 'switch/native-demo/**'
      - '.github/workflows/switch-native-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify demo has no browser dependencies
        shell: bash
        run: |
          node --check switch/native-demo/main.js
          ! grep -E 'document\.|window\.location|WebApplet|Brewser' switch/native-demo/main.js
          node -e "const p=require('./switch/native-demo/package.json'); if(!p.nacp.id.startsWith('01')||!p.nacp.id.endsWith('0000'))process.exit(1)"
      - name: Stress test HP zero, respawn, repeated collisions and diagnostic frames
        run: node --test switch/native-demo/respawn.test.cjs
      - name: Install pinned-by-lockfile runtime packagers
        working-directory: switch/native-demo
        run: npm install --no-audit --no-fund
      - name: Bundle demo into RomFS
        working-directory: switch/native-demo
        run: npm run build
      - name: Bundle pinned offline Kanto Pokemon PNG sprites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p switch/native-demo/romfs/sprites
          upstream=1b3b7c0a538dd2226ae08d0d2f8955125075bbd4
          for dex in 25 19 16 41; do
            curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 \
              "https://raw.githubusercontent.com/PokeAPI/sprites/$upstream/sprites/pokemon/$dex.png" \
              --output "switch/native-demo/romfs/sprites/$dex.png"
          done
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          for dex in (25,19,16,41):
              blob=Path(f'switch/native-demo/romfs/sprites/{dex}.png').read_bytes()
              assert blob[:8]==bytes([137,80,78,71,13,10,26,10]),f'invalid PNG dex={dex}'
              w,h=unpack('>II',blob[16:24])
              assert 24<=w<=256 and 24<=h<=256,f'unexpected sprite size {dex}: {w}x{h}'
              assert len(blob)>100,f'empty sprite {dex}'
              print('offline sprite',dex,w,h,len(blob))
          PY
      - name: Install icon generator
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Build 3 independent NRO diagnostics (no ZL needed)
        working-directory: switch/native-demo
        shell: bash
        run: |
          set -euo pipefail
          cp romfs/main.js /tmp/pkmsvv-switch-diag-main.js
          mkdir -p ../../dist/switch-native-demo
          for mode in 0 1 2; do
            export PKMSVV_RENDER_MODE="$mode"
            node - <<'NODE'
          const fs=require('node:fs');
          const src=fs.readFileSync('/tmp/pkmsvv-switch-diag-main.js','utf8');
          const anchor='const DIAG_BOOT_MODE=0;';
          if(src.split(anchor).length!==2)throw Error('Diagnostic boot-mode anchor drift');
          const mode=Number(process.env.PKMSVV_RENDER_MODE);
          if(![0,1,2].includes(mode))throw Error('Invalid diagnostic render mode');
          fs.writeFileSync('romfs/main.js',src.replace(anchor,'const DIAG_BOOT_MODE='+mode+';'));
          NODE
            # Make each NRO unmistakable in hbmenu: embedded title,
            # version, unique title ID, and a distinctive square icon.
            node - <<'NODE'
          const fs=require('node:fs');
          const mode=Number(process.env.PKMSVV_RENDER_MODE);
          const names=['MIN','STATIC','FULL'];
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.name='pkmsvv-diag-'+names[mode].toLowerCase();
          p.version='0.0.7';
          p.nacp={...(p.nacp||{}),
            id:'01473656560'+String(mode+1)+'0000',
            title:'PKMSVV '+names[mode]+' 07'};
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n');
          NODE
            case "$mode" in
              0) suffix=MIN; icon=MIN ;;
              1) suffix=STATIC; icon=STATIC ;;
              2) suffix=FULL-NO-SPRITES; icon=FULL ;;
            esac
            python3 make_icon.py "$icon"
            npm run nro
            test -s "pkmsvv-diag-${icon,,}.nro"
            cp "pkmsvv-diag-${icon,,}.nro" "../../dist/switch-native-demo/PKMSVV-Switch-Diag-v007-$suffix.nro"
          done
          ls -lh ../../dist/switch-native-demo/
      - name: Confirm all three independent render variants
        shell: bash
        run: |
          set -euo pipefail
          for suffix in MIN STATIC FULL-NO-SPRITES; do
            test -s "dist/switch-native-demo/PKMSVV-Switch-Diag-v007-$suffix.nro"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-Switch-Diagnostic-v007-Labeled-NROs
          path: dist/switch-native-demo/*.nro
          retention-days: 14
          if-no-files-found: error
      # nxjs-nsp --fat currently requires a keyset; don't mishandle console keys.
      # NSP build must be a separately reviewed workflow once legal key material
      # and packaging prerequisites are established.
