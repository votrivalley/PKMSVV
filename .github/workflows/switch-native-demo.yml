name: Switch Native Demo (nx.js - no Brewser)
on:
  push:
    branches: [feature/switch-native-nxjs-demo]
    paths:
      - 'switch/native-demo/**'
      - '.github/workflows/switch-native-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify demo has no browser dependencies
        shell: bash
        run: |
          node --check switch/native-demo/main.js
          ! grep -E 'document\.|window\.location|WebApplet|Brewser' switch/native-demo/main.js
          node -e "const p=require('./switch/native-demo/package.json'); if(!p.nacp.id.startsWith('01')||!p.nacp.id.endsWith('0000'))process.exit(1)"
      - name: Stress test HP zero, respawn, repeated collisions and diagnostic frames
        run: node --test switch/native-demo/respawn.test.cjs
      - name: Install pinned-by-lockfile runtime packagers
        working-directory: switch/native-demo
        run: npm install --no-audit --no-fund
      - name: Bundle demo into RomFS
        working-directory: switch/native-demo
        run: npm run build
      - name: Build self-contained NRO
        working-directory: switch/native-demo
        run: npm run nro
      - name: Verify and stage standalone NRO
        shell: bash
        run: |
          set -euo pipefail
          test -s switch/native-demo/pkmsvv-switch-native-demo.nro
          mkdir -p dist/switch-native-demo
          cp switch/native-demo/pkmsvv-switch-native-demo.nro dist/switch-native-demo/
          ls -lh dist/switch-native-demo/
      - uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-Switch-Native-Demo-NRO
          path: dist/switch-native-demo/*.nro
          retention-days: 14
          if-no-files-found: error
      # nxjs-nsp --fat currently requires a keyset; don't mishandle console keys.
      # NSP build must be a separately reviewed workflow once legal key material
      # and packaging prerequisites are established.
