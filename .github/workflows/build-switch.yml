name: Build Switch One-File NRO Beta

on:
  workflow_dispatch:
  push:
    branches:
      - feature/lan-local-beta
    paths:
      - '.github/workflows/build-switch.yml'
      - 'switch/**'
      - 'scripts/prepare-switch.cjs'
      - 'tests/switch.test.cjs'

permissions:
  contents: read

jobs:
  switch:
    name: Package self-installing Switch NRO
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned original PokéSurvivor
        run: |
          git init vendor/pokesurvivor
          git -C vendor/pokesurvivor remote add origin https://github.com/JPTER78/pokesurvivor.git
          git -C vendor/pokesurvivor fetch --depth 1 origin 11fe868c640b62ac37beacc222e056bc4d9ec892
          git -C vendor/pokesurvivor checkout --detach FETCH_HEAD
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Compile game with current PKMSVV features
        env:
          PKMSVV_SWITCH_BOOT: '1'
        run: |
          npm run prepare:game
          npm run prepare:icons
          npm run prepare:android
          npm run prepare:android:full-lan
          npm run test:mega
          npm run prepare:switch
      - name: QA updated game, save safety and offline Switch assets
        run: |
          npm run test:switch
          node --test tests/lan-ai-modes.test.cjs tests/unified-coop.test.cjs
      - name: Stage self-extracting NRO RomFS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p switch/nro-forwarder/romfs/game
          cp -a dist/switch-package/switch/brewser/apps/com.votrivalley.pkmsvv/. switch/nro-forwarder/romfs/game/
          printf '%s-switch-%s\n' "$(node -p "require('./package.json').version")" "${GITHUB_SHA:0:12}" > switch/nro-forwarder/romfs/version.txt
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 \
            -o switch/nro-forwarder/romfs/brewser.nro \
            "https://github.com/natureglass/Brewser/releases/download/v0.1.1.31/brewser.nro"
          echo "8ce31f5b7dfb617c18a705d0c5fc955b59f60d445b5a76e250a1dd98ccd04b13  switch/nro-forwarder/romfs/brewser.nro" | sha256sum -c -
          curl -fL --retry 3 -o switch/nro-forwarder/romfs/BREWSER_LICENSE.txt \
            "https://raw.githubusercontent.com/natureglass/Brewser/v0.1.1.31/LICENSE"
          test -s switch/nro-forwarder/romfs/game/ai/game/index.html
          du -sh switch/nro-forwarder/romfs
      - name: Create official Votri Valley Switch icon
        run: |
          node -e "require('sharp')('build/icon.png').resize(256,256).jpeg({quality:90}).toFile('switch/nro-forwarder/icon.jpg').catch(e=>{console.error(e);process.exit(1)})"
      - name: Build NRO with engine and game in one file
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workspace" -w /workspace/switch/nro-forwarder \
            -e DEVKITPRO=/opt/devkitpro devkitpro/devkita64:20260219 \
            make -j2 APP_VERSION="$(node -p "require('./package.json').version")"
          python3 - <<'PY'
          from pathlib import Path
          nro=Path('switch/nro-forwarder/PKMSVV.nro')
          data=nro.read_bytes()
          assert data[0x10:0x14]==b'NRO0', 'Invalid NRO format'
          assert len(data)>70_000_000, 'Missing embedded runtime and game'
          assert b'com.votrivalley.pkmsvv' in data, 'Missing bundled app manifest'
          assert b'PKMSVV' in data, 'Missing launcher identifier'
          print(f'Self-contained installer NRO: {len(data)/1048576:.1f} MiB')
          PY
      - name: Upload ONE NRO only
        uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-Switch-One-File-NRO-v1.5.41-TEST
          path: switch/nro-forwarder/PKMSVV.nro
          retention-days: 14
          if-no-files-found: error
