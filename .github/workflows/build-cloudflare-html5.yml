name: Build Cloudflare Pages FULL HTML5
on:
  push:
    branches: [feature/lan-local-beta]
    paths:
      - 'scripts/bundle-wifi-qr.cjs'
      - 'tests/wifi-pwa-offline.cjs'
      - 'scripts/patch-lan.cjs'
      - 'scripts/prepare-cloudflare.cjs'
      - 'scripts/prepare-cloudflare-ai.cjs'
      - 'scripts/compile-standalone-ai.cjs'
      - 'scripts/patch-lan-ai.cjs'
      - 'scripts/patch-arena-v1529.cjs'
      - 'tests/arena-v1529*.cjs'
      - 'tests/spawn-arena-v1529.test.cjs'
      - 'scripts/package-standalone-ai.cjs'
      - 'scripts/prepare-lan.cjs'
      - 'scripts/patch-lan.cjs'
      - 'src/lan/solo-ai-bus.js'
      - 'src/lan/lan-ai.js'
      - 'tests/cloudflare-ai.test.cjs'
      - 'tests/cloudflare-ai-browser.cjs'
      - 'tests/coop-platform-browser.cjs'
      - 'tests/competitive-rewards.test.cjs'
      - 'tests/dex-header-actions.test.cjs'
      - 'tests/starter-onboarding-browser.cjs'
      - 'src/pkmsvv-story.js'
      - 'scripts/patch-story.cjs'
      - 'scripts/prepare-ios.cjs'
      - 'src/cloudflare/**'
      - 'src/ios/**'
      - 'src/shared/**'
      - 'tests/coop-icon-consistency.test.cjs'
      - 'tests/unified-coop.test.cjs'
      - 'tests/local-shell-ui.test.cjs'
      - 'tests/local-ui-lan-host-regression.test.cjs'
      - 'tests/pages-lan-connect-runtime.test.cjs'
      - 'src/web/**'
      - 'tests/cloudflare-pages.test.cjs'
      - 'package.json'
      - '.github/workflows/build-cloudflare-html5.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Deploy to Cloudflare Pages (requires Cloudflare secrets and existing project)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  full-html5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load pinned upstream game
        shell: bash
        run: |
          git init vendor/pokesurvivor
          git -C vendor/pokesurvivor remote add origin https://github.com/JPTER78/pokesurvivor.git
          git -C vendor/pokesurvivor fetch --depth 1 origin 11fe868c640b62ac37beacc222e056bc4d9ec892
          git -C vendor/pokesurvivor checkout --detach FETCH_HEAD
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build complete Cloudflare HTML5 game
        run: npm run prepare:cloudflare
      - name: Verify entire game, PWA, save UI, free-tier limits
        run: npm run test:cloudflare && node --test tests/cloudflare-ai.test.cjs tests/local-shell-ui.test.cjs tests/local-ui-lan-host-regression.test.cjs tests/pages-lan-connect-runtime.test.cjs tests/unified-coop.test.cjs
      - name: Verify personal ticket and Shiny ownership in standalone Web AI
        run: node --test tests/competitive-rewards.test.cjs
      - name: Verify P0 arena support nests and opening spawns
        run: node --test tests/arena-v1529.test.cjs tests/spawn-arena-v1529.test.cjs tests/lan-bot-snapshot.test.cjs tests/wifi-qr-license.test.cjs
      - name: Verify Wi-Fi Host navigation after losing Internet
        shell: bash
        run: PKMSVV_BROWSER="$(command -v google-chrome)" node tests/wifi-pwa-offline.cjs
      - name: Ten-minute Web P0 profile with 10 trainers and AI
        shell: bash
        run: PKMSVV_PLATFORM=web PKMSVV_BROWSER="$(command -v google-chrome)" node tests/arena-v1529-soak.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PKMSVV-P0-v1529-QA-Web
          path: dist/qa/v1529-*
          if-no-files-found: ignore
      - name: Browser smoke QA of real HTML5 AI in all three modes
        run: node tests/cloudflare-ai-browser.cjs
      - name: Verify main menu to AI, match finish and replay on Web
        shell: bash
        run: PKMSVV_BROWSER="$(command -v google-chrome)" node tests/coop-platform-browser.cjs
      - name: Verify Web first-run starter choice after every skip path
        shell: bash
        run: PKMSVV_PLATFORM=cloudflare PKMSVV_BROWSER="$(command -v google-chrome)" node tests/starter-onboarding-browser.cjs
      - name: Inspect ready-to-deploy website (no nested ZIP)
        shell: bash
        run: |
          test -s dist/cloudflare/index.html
          test -s dist/cloudflare/game/index.html
          test -s dist/cloudflare/game/js/app.min.js
          test -s dist/cloudflare/ai/game/index.html
          test -s dist/cloudflare/ai/game/js/app.min.js
          if find dist/cloudflare -type f \( -iname '*.zip' -o -iname '*.7z' \) | grep -q .; then
            echo "::error::Cloudflare deployment folder must not contain ZIP or 7Z archives."
            exit 1
          fi
          cat dist/cloudflare/build-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-Cloudflare-Pages-FULL-HTML5
          path: dist/cloudflare/
          retention-days: 14
          if-no-files-found: error
      - name: Deploy only when explicitly requested and authorized
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Please configure CF_API_TOKEN and CF_ACCOUNT_ID as repository Actions Secrets."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy dist/cloudflare --project-name pkmsvv-web --branch pkmsvv-web
