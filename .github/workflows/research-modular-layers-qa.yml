name: Research Laboratory Source Sprites QA - never production
on:
  push:
    branches: [feature/research-modular-sprites-qa-20261120, feature/web-3ds-skill-effects-passives-qa-20261121]
    paths:
      - '.github/workflows/research-modular-layers-qa.yml'
      - 'scripts/extract-research-layers.cjs'
      - 'docs/research-lab-layer-preview.html'
      - 'tests/research-source-extraction.test.cjs'
      - 'assets/research-station-icons.png'
      - 'data/pkmsvv-coop-lab-catalog.json'
      - 'src/pkmsvv-wiki.js'
      - 'src/pkmsvv-pc-menu-clean-qa.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install art tooling
        run: |
          npm pkg set 'overrides.node-abi=4.40.0'
          npm install --no-audit --no-fund
      - name: Validate lab scene and sprite registry
        run: node --test tests/research-source-extraction.test.cjs
      - name: Render exact original cutouts and draft empty background
        run: node scripts/extract-research-layers.cjs dist/research-modular-sprite-preview
      - name: Add offline click-to-hide art comparison preview
        run: cp docs/research-lab-layer-preview.html dist/research-modular-sprite-preview/index.html
      - name: Verify all nine sprites independent
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),d='dist/research-modular-sprite-preview';
          const m=JSON.parse(fs.readFileSync(path.join(d,'manifest.json'),'utf8'));
          if(m.layers.length!==9||m.stationProps.length!==5||!m.pixelExactReassembly||m.overlappingLayerPixels!==0||!m.readyForLayerPreview||m.readyForFurnitureSwap)
            throw Error('Research Lab art approval state is wrong');
          for(const n of [...m.layers.map(x=>x.file),'clean-backdrop.png','room-reference.webp','index.html']){
            const f=path.join(d,n);
            if(!fs.existsSync(f)||fs.statSync(f).size<500)throw Error('Missing '+n);
          }
          for(const p of m.stationProps){
            if(!fs.existsSync(path.join(d,p.file))||p.width<8||p.height<8)throw Error('Missing prop '+p.id);
          }
          console.log('Nine independent original lab sprites + five cropped props; pixel-exact original reassembly PASS');
          NODE
      - name: Upload art QA artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: PKMSVV-Research-Lab-Split-Sprites-QA
          path: dist/research-modular-sprite-preview/
          retention-days: 7
