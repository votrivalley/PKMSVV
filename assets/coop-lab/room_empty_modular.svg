<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" width="960" height="672">
<title>Phòng nghiên cứu Pippi — nền rỗng, đồ nội thất được vẽ trên lớp riêng</title>
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#143c47"/><stop offset="1" stop-color="#27656c"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#447e71"/><stop offset="1" stop-color="#1c514c"/></linearGradient>
 <linearGradient id="brass" x2="0" y2="1"><stop stop-color="#f8d991"/><stop offset=".45" stop-color="#b88c4b"/><stop offset="1" stop-color="#77512f"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#b2f8c7" stop-opacity=".28"/><stop offset="1" stop-color="#b2f8c7" stop-opacity="0"/></radialGradient>
 <pattern id="wallTile" width="96" height="48" patternUnits="userSpaceOnUse">
  <path d="M0 0H96V48H0Z" fill="#1e4d58" stroke="#123743" stroke-width="5"/>
  <path d="M48 0V24M0 24H96M24 24V48M72 24V48" stroke="#39737a" stroke-width="3"/>
  <path d="M8 8h24m26 13h25m-60 16h23" stroke="#77aaa4" stroke-opacity=".18" stroke-width="3"/>
 </pattern>
 <pattern id="floorTile" width="48" height="48" patternUnits="userSpaceOnUse">
