  <path d="M4 4H44V10H4M4 20H14M24 39H43" fill="#67a088" opacity=".22"/>
  <path d="M6 43h11m25-35h3" stroke="#aed5a0" opacity=".22" stroke-width="2"/>
 </pattern>
 <pattern id="speckle" width="21" height="23" patternUnits="userSpaceOnUse">
  <path d="M4 5h3v3H4Zm13 12h2v2h-2Z" fill="#9dbd9a" opacity=".15"/>
 </pattern>
</defs>
